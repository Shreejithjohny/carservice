name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Exact versions with checked hashes, prebuilt wheels only (no package setup scripts run).
      # Regenerate after changing requirements*.txt; see backend/requirements-ci.txt
      - run: "pip install --require-hashes --only-binary :all: -r requirements-ci.txt"
      - name: Django system checks
        run: python manage.py check
        env:
          DEBUG: "True"
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "True"
      - name: Tests with coverage
        run: coverage run manage.py test api
      - name: Coverage report
        run: |
          coverage report
          coverage xml
          echo '### Backend coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report --skip-covered | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Locked versions from package-lock.json; package install scripts are not needed and not run
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Type-check the browser tests
        run: npm run typecheck:e2e
      - name: Type-check and build
        run: npm run build

  e2e:
    name: Browser tests (Playwright)
    # Pinned: Playwright 1.56 can only install its browser on Ubuntu releases it knows (up to 24.04).
    # Move this to a newer image together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Exact versions with checked hashes, prebuilt wheels only (no package setup scripts run).
      # Regenerate after changing requirements*.txt; see backend/requirements-ci.txt
      - run: "pip install --require-hashes --only-binary :all: -r ../backend/requirements-ci.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Locked versions from package-lock.json; package install scripts are not needed and not run
      - run: npm ci --ignore-scripts
      # npm scripts run the locked Playwright from node_modules (npx could fetch another version)
      - run: npm run e2e:install-browser
      - run: npm run test:e2e
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
