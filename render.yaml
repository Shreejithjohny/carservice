# Render blueprint (https://render.com): New > Blueprint > pick this repository.
# It creates the web server from the Dockerfile and a PostgreSQL database, and connects them.
# Check Render's current plans and prices before choosing; free plans sleep when idle and free
# databases expire. See docs/DEPLOY.md for the remaining settings (Google, Razorpay, alerts).
services:
  - type: web
    name: doorstep
    runtime: docker
    plan: free
    healthCheckPath: /api/health-check/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: doorstep-db
          property: connectionString
      - key: OTP_BYPASS
        value: "False"
      - key: PAYMENT_GATEWAY
        value: ""
      # Your public address, e.g. https://doorstep.onrender.com (used in invoice QR codes)
      - key: FRONTEND_URL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_LEGAL_NAME
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: BUSINESS_CITY
        sync: false

databases:
  - name: doorstep-db
    plan: free
