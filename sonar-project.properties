# Used only by the "SonarCloud coverage" CI job, once SonarCloud is switched to CI-based analysis
# (SonarCloud's automatic analysis ignores this file). Check both keys on SonarCloud under
# Administration > Information, and correct them here if they differ.
sonar.projectKey=Shreejithjohny_carservice
sonar.organization=shreejithjohny

sonar.sources=backend/api,backend/config,client/src
sonar.exclusions=backend/api/migrations/**,backend/api/tests.py,client/src/**/*.test.ts
sonar.tests=backend/api/tests.py,client/src,client/e2e
sonar.test.inclusions=backend/api/tests.py,client/src/**/*.test.ts,client/e2e/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info
